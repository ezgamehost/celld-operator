{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.operator.watchNamespace }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  {{- with .Values.operator.watchNamespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: celld-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.operator.watchNamespace }}Role{{ else }}ClusterRole{{ end }}
  name: celld-operator-manager-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.controllerManager.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
{{- end -}}
