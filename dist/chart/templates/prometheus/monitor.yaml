# To integrate with Prometheus.
{{- if and .Values.prometheus.enable .Values.metrics.enable }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    control-plane: controller-manager
  name: celld-operator-controller-manager-metrics-monitor
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
    - path: /metrics
      port: {{ if .Values.metrics.insecure }}http{{ else }}https{{ end }}
      scheme: {{ if .Values.metrics.insecure }}http{{ else }}https{{ end }}
      honorLabels: true
      {{- if not .Values.metrics.insecure }}
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        {{- if .Values.certmanager.enable }}
        serverName: celld-operator-controller-manager-metrics-service.{{ .Release.Namespace }}.svc
        # Apply secure TLS configuration with cert-manager
        insecureSkipVerify: false
        ca:
          secret:
            name: metrics-server-cert
            key: ca.crt
        cert:
          secret:
            name: metrics-server-cert
            key: tls.crt
        keySecret:
          name: metrics-server-cert
          key: tls.key
        {{- else }}
        # Development/Test mode (insecure configuration)
        insecureSkipVerify: true
        {{- end }}
      {{- end }}
  selector:
    matchLabels:
      control-plane: controller-manager
{{- end }}
