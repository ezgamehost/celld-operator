{{- if .Values.metrics.enable }}
apiVersion: v1
kind: Service
metadata:
  name: celld-operator-controller-manager-metrics-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  ports:
    - port: {{ .Values.metrics.port }}
      targetPort: {{ .Values.metrics.port }}
      protocol: TCP
      name: {{ if .Values.metrics.insecure }}http{{ else }}https{{ end }}
  selector:
    control-plane: controller-manager
{{- end }}
