---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: workerapps.celld-operator.io
spec:
  group: celld-operator.io
  names:
    kind: WorkerApp
    listKind: WorkerAppList
    plural: workerapps
    singular: workerapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.rolledOutAppVersion
      name: App
      type: string
    - jsonPath: .status.fleet.ready
      name: Ready
      type: integer
    - jsonPath: .status.fleet.restoring
      name: Restoring
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WorkerApp is the Schema for the workerapps API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WorkerApp
            properties:
              appVersion:
                description: |-
                  appVersion is the expected deployment, not a runtime pin: celld v0.4
                  adopts the bucket pointer in place. auto reads the pointer using the
                  dedicated tracking credential. Status verifies live node versions.
                minLength: 1
                type: string
              autoscaling:
                description: |-
                  AutoscalingSpec enables custom-metrics autoscaling for the fleet. The
                  operator materializes it as a KEDA ScaledObject over its own
                  /state-derived Prometheus metrics, and pauses it during rollouts so the
                  scaler and the partition controller never fight over replica count.
                properties:
                  enabled:
                    default: false
                    type: boolean
                  maxReplicas:
                    default: 10
                    description: maxReplicas is the tenant's cost ceiling.
                    format: int32
                    minimum: 1
                    type: integer
                  minReplicas:
                    default: 2
                    description: minReplicas is the scale floor; keep >= 2 for HA.
                    format: int32
                    minimum: 1
                    type: integer
                  targets:
                    description: AutoscalingTargets are the scale signals (docs/celld-behaviors.md,
                      Autoscaling).
                    properties:
                      p95LatencyMs:
                        description: |-
                          p95LatencyMs adds a latency target so traffic-bound,
                          stateless-Worker-heavy apps scale even at low cell counts. The query
                          reads Istio destination telemetry, so it needs Istio metrics in the
                          same Prometheus. Unset disables the latency signal.
                        format: int32
                        minimum: 1
                        type: integer
                      residentCellUtilization:
                        default: 70
                        description: |-
                          residentCellUtilization is the target fleet-average percentage of
                          occupied resident cells vs maxResidentCells. Kept conservative by
                          default because celld has no rebalancer and new capacity absorbs
                          slowly; any pod in pressure shedding triggers scale-up regardless.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                    type: object
                type: object
                x-kubernetes-validations:
                - message: minReplicas must not exceed maxReplicas
                  rule: self.minReplicas <= self.maxReplicas
              bucket:
                description: BucketSpec locates the fleet's slice of the object store.
                properties:
                  credentialsFrom:
                    description: credentialsFrom selects the fleet's bucket credential.
                    properties:
                      azureClientID:
                        description: |-
                          azureClientID is the client ID of a Microsoft Entra workload identity
                          for an az:// container (AKS workload identity). The fleet
                          ServiceAccount is annotated with it and fleet pods carry the
                          azure.workload.identity/use label, so the AKS webhook injects the
                          federated token celld reads (AZURE_CLIENT_ID, AZURE_TENANT_ID,
                          AZURE_FEDERATED_TOKEN_FILE, AZURE_AUTHORITY_HOST). The identity
                          needs Storage Blob Data Contributor on the container.
                        type: string
                      iamRole:
                        description: |-
                          iamRole is an IAM role ARN assumed via the pod's service account
                          (IRSA / Workload Identity), or the literal "auto" to have the
                          operator provision a role scoped to the fleet's prefix.
                        type: string
                      secretRef:
                        description: |-
                          secretRef names a Secret whose keys are injected as environment:
                          AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for an s3:// bucket, or
                          AZURE_STORAGE_ACCOUNT_KEY for an az:// container. For stores where
                          identity-based auth is unavailable.
                        minLength: 1
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: select at most one credential family
                      rule: '[has(self.iamRole) && self.iamRole.size() > 0, has(self.secretRef)
                        && self.secretRef.size() > 0, has(self.azureClientID) && self.azureClientID.size()
                        > 0].filter(x, x).size() <= 1'
                  endpoint:
                    description: |-
                      endpoint is the S3-compatible endpoint URL, when not AWS S3.
                      Rejected by celld for gs:// and az:// buckets.
                    maxLength: 2048
                    type: string
                  name:
                    description: |-
                      name is the fleet bucket and prefix, e.g. "s3://platform-cells/apps/chat",
                      "gs://platform-cells/apps/chat", or "az://platform-cells/apps/chat"
                      (for az:// the bucket is a Blob Storage container in the account
                      named by storageAccount). The store must satisfy celld's fencing
                      contract (conditional create/overwrite, read-after-write); see
                      docs/celld-behaviors.md for the qualified list.
                    maxLength: 1024
                    pattern: ^(s3|gs|az)://[a-zA-Z0-9][a-zA-Z0-9._-]*(/[a-zA-Z0-9._/-]+)?$
                    type: string
                  region:
                    description: region is the storage region, when it cannot be inferred.
                    type: string
                  storageAccount:
                    description: |-
                      storageAccount is the Azure storage account that holds an az://
                      container (AZURE_STORAGE_ACCOUNT_NAME). Required for az://, ignored
                      otherwise.
                    maxLength: 24
                    minLength: 3
                    pattern: ^[a-z0-9]+$
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: an az:// bucket requires storageAccount (the Azure storage
                    account; the bucket name is the container)
                  rule: '!self.name.startsWith(''az://'') || (has(self.storageAccount)
                    && self.storageAccount.size() > 0)'
                - message: endpoint applies to s3:// buckets only; celld rejects an
                    endpoint for gs:// and az://
                  rule: '!has(self.endpoint) || self.endpoint.size() == 0 || self.name.startsWith(''s3://'')'
                - message: bucket identity is immutable; migrate to a new WorkerApp
                  rule: self.name == oldSelf.name
                - message: storage account is immutable
                  rule: has(self.storageAccount) == has(oldSelf.storageAccount) &&
                    (!has(self.storageAccount) || self.storageAccount == oldSelf.storageAccount)
                - message: bucket endpoint is immutable
                  rule: has(self.endpoint) == has(oldSelf.endpoint) && (!has(self.endpoint)
                    || self.endpoint == oldSelf.endpoint)
              celld:
                description: CelldSpec pins the celld runtime for the fleet.
                properties:
                  image:
                    description: |-
                      image is an explicitly versioned celld image. Known incompatible versions
                      require Recreate; compatible releases roll one pod at a time.
                    minLength: 1
                    type: string
                  updateStrategy:
                    default: Rolling
                    description: updateStrategy selects the rollout path for celld
                      version changes.
                    enum:
                    - Rolling
                    - Recreate
                    type: string
                required:
                - image
                type: object
              clusterDomain:
                default: cluster.local
                description: clusterDomain is the Kubernetes DNS suffix.
                pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                type: string
              deployTrackingSecretRef:
                description: |-
                  deployTrackingSecretRef is a dedicated read-only S3 credential for
                  deploy/current.json. The operator never uses its ambient cloud identity.
                minLength: 1
                type: string
              deploymentPolicy:
                default: Restart
                description: deploymentPolicy selects adoption in place or an additional
                  gated restart.
                enum:
                - Restart
                - InPlace
                type: string
              durability:
                default: bucket
                description: |-
                  durability selects how celld proves a write before acknowledging it:
                  fleet (celld's default: two follower nodes fsync it, the bucket
                  upload follows) or bucket (the write is in the bucket first). Unset
                  selects bucket acknowledgement for safety with ephemeral storage. Changing it restarts the fleet through the
                  ordinary gated rollout.
                enum:
                - fleet
                - bucket
                type: string
              hostnames:
                description: |-
                  hostnames route to this app. One route object is reconciled in the
                  app's namespace carrying every hostname; what kind depends on the
                  operator's --ingress-mode.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              replicas:
                default: 3
                description: |-
                  replicas is the fleet size when autoscaling is disabled, and the
                  initial size otherwise.
                format: int32
                minimum: 1
                type: integer
              resources:
                description: |-
                  ResourcesSpec sizes one fleet pod. The operator derives the container
                  limit, CELLD_MAX_RSS_MB (~80% of the limit, set explicitly so the ceiling
                  is visible in the pod spec; celld would derive the same value from the
                  cgroup limit itself), and admission caps from these two numbers. celld
                  applies that threshold to the memory its cells hold and keeps its own
                  absolute cap at 95% of the limit on the process RSS (docs/celld-behaviors.md F10).
                properties:
                  cpuMillis:
                    default: 500
                    description: cpuMillis is the CPU request per pod.
                    format: int32
                    minimum: 1
                    type: integer
                  ephemeralStorageGi:
                    default: 10
                    description: ephemeralStorageGi bounds writable temporary storage.
                    format: int32
                    minimum: 1
                    type: integer
                  maxResidentCells:
                    default: 1000
                    description: |-
                      maxResidentCells is the hard per-node resident-cell admission limit
                      (CELLD_MAX_RESIDENT_CELLS). Upstream sizing: ~1000 cells per 8 GiB.
                    format: int32
                    minimum: 1
                    type: integer
                  memoryGi:
                    default: 8
                    description: memoryGi is the container memory limit per pod, in
                      GiB.
                    format: int32
                    maximum: 65536
                    minimum: 1
                    type: integer
                type: object
              scheduling:
                description: |-
                  SchedulingSpec controls placement. Persistent fleets always require distinct
                  hosts; spreadAcrossZones additionally requires distinct zones.
                properties:
                  nodeSelector:
                    additionalProperties:
                      type: string
                    type: object
                  spreadAcrossZones:
                    type: boolean
                  tolerations:
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                type: object
              service:
                description: |-
                  service shapes the serving Service (type, annotations) for internal
                  consumers and load-balancer setups.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: |-
                      annotations merge onto the serving Service; cloud load-balancer
                      configuration (internal LB flags, protocol hints, health-check
                      tuning) lives here.
                    type: object
                  type:
                    default: ClusterIP
                    description: Service Type string describes ingress methods for
                      a service
                    enum:
                    - ClusterIP
                    - LoadBalancer
                    - NodePort
                    type: string
                type: object
              storage:
                description: |-
                  StorageSpec provisions retained local state per ordinal. Changing storage
                  configuration requires a new WorkerApp; existing PVCs are never deleted.
                properties:
                  sizeGi:
                    format: int32
                    maximum: 65536
                    minimum: 1
                    type: integer
                  storageClassName:
                    type: string
                required:
                - sizeGi
                type: object
              telemetry:
                description: TelemetrySpec controls celld's built-in tracing (CELLD_OTEL).
                properties:
                  enabled:
                    default: true
                    type: boolean
                  otlpEndpoint:
                    description: |-
                      otlpEndpoint is the collector base URL for the otlp sink
                      (OTEL_EXPORTER_OTLP_ENDPOINT), e.g. "http://otel-collector.monitoring.svc:4318".
                      Setting it without a sink selects the otlp sink.
                    type: string
                  retention:
                    default: 30d
                    description: |-
                      retention is CELLD_OTEL_RETENTION for the bucket sink, e.g. "30d",
                      or "none" to defer to bucket lifecycle rules. Ignored by the otlp
                      sink.
                    type: string
                  sink:
                    description: |-
                      sink selects the destination: bucket (Parquet in the fleet bucket)
                      or otlp (an OpenTelemetry collector). Unset means bucket, unless
                      otlpEndpoint is set — then otlp is inferred.
                    enum:
                    - bucket
                    - otlp
                    type: string
                type: object
              trustForwardedHeaders:
                description: |-
                  trustForwardedHeaders lets X-Forwarded-Host and X-Forwarded-Proto
                  set the scheme and host of request.url (CELLD_TRUST_FORWARDED_HEADERS).
                  celld ignores both headers by default, so behind a TLS-terminating
                  ingress a Worker sees its pod address as its URL. Enable it only when
                  every hop in front of the fleet replaces both headers (ingress-nginx
                  does; Envoy-based gateways set X-Forwarded-Proto but not always
                  X-Forwarded-Host), since celld takes the last value of each.
                type: boolean
              vars:
                description: VarsSpec supplies Worker variables and secrets.
                properties:
                  secretRef:
                    description: |-
                      secretRef names a Secret whose data is mounted and passed via
                      CELLD_VARS_FILE. Rotation is a Secret update plus an ordinary gated
                      rollout; values are never baked into bundles.
                    minLength: 1
                    type: string
                required:
                - secretRef
                type: object
              websockets:
                description: |-
                  websockets selects the WebSocket profile: long edge timeouts where the
                  ingress mode can express them (httproute and ingress; not
                  virtualservice) and a conservative scale-down window. No session
                  affinity is configured.
                type: boolean
            required:
            - appVersion
            - bucket
            - celld
            type: object
            x-kubernetes-validations:
            - message: auto requires an s3 bucket and a deployTrackingSecretRef
              rule: self.appVersion != 'auto' || (self.bucket.name.startsWith('s3://')
                && has(self.deployTrackingSecretRef))
            - message: fleet durability requires persistent storage and at least three
                replicas
              rule: '!has(self.durability) || self.durability != ''fleet'' || (has(self.storage)
                && self.replicas >= 3 && (!has(self.autoscaling) || !self.autoscaling.enabled
                || self.autoscaling.minReplicas >= 3))'
            - message: storage is immutable; migrate to a new WorkerApp
              rule: has(self.storage) == has(oldSelf.storage) && (!has(self.storage)
                || self.storage == oldSelf.storage)
          status:
            description: status defines the observed state of WorkerApp
            properties:
              conditions:
                description: conditions represent the current state of the WorkerApp
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deployments:
                description: deployments are fresh observations; missing nodes are
                  not inferred.
                items:
                  description: PodDeployment reports a live node's adoption state.
                  properties:
                    draining:
                      format: int32
                      type: integer
                    generation:
                      format: int64
                      type: integer
                    name:
                      type: string
                    swapping:
                      format: int64
                      type: integer
                    version:
                      type: string
                  required:
                  - draining
                  - generation
                  - name
                  - swapping
                  - version
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              expectedAppVersion:
                description: expectedAppVersion is the resolved deployment target.
                type: string
              fleet:
                description: |-
                  FleetStatus aggregates the per-pod /state the operator polls. The fields
                  serialize even at zero so `kubectl get` renders 0 rather than a blank.
                properties:
                  ready:
                    description: ready is the number of pods passing the celld health
                      check.
                    format: int32
                    type: integer
                  restoring:
                    description: |-
                      restoring is the fleet-wide sum of cold routes holding or awaiting an
                      activation permit. Rollouts step only at restoring == 0.
                    format: int32
                    type: integer
                type: object
              phase:
                description: WorkerAppPhase summarizes the fleet at a glance.
                enum:
                - Pending
                - Ready
                - RollingOut
                - Recreating
                - Degraded
                type: string
              rolledOutAppVersion:
                description: |-
                  rolledOutAppVersion is the appVersion every fleet pod is serving.
                  It trails spec.appVersion while a rollout is in flight.
                type: string
              rollout:
                description: RolloutStatus reports the partition-stepped rollout (docs/celld-behaviors.md).
                properties:
                  partition:
                    description: |-
                      partition is the current StatefulSet rolling-update partition owned
                      by the rollout controller. 0 means no rollout in progress.
                    format: int32
                    type: integer
                  waitingOn:
                    description: |-
                      waitingOn names the gate the rollout is blocked on, e.g.
                      "chat-celld-2: not ready" or "fleet: restoring=3". Empty when not
                      waiting.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: WorkerApp name must not exceed 48 characters
          rule: size(self.metadata.name) <= 48
    served: true
    storage: true
    subresources:
      status: {}
