apiVersion: platform.ezghcloud.com/v1alpha1
kind: WorkerApp
metadata:
  labels:
    app.kubernetes.io/name: celld-operator
    app.kubernetes.io/managed-by: kustomize
  name: chat
spec:
  hostnames: ["chat.acme.ezghcloud.com"]
  appVersion: sha-abc123
  celld:
    image: ghcr.io/denoland/celld:v0.2.0
    updateStrategy: Rolling
  replicas: 3
  bucket:
    name: s3://platform-cells/apps/chat
    credentialsFrom:
      iamRole: auto
  resources:
    memoryGi: 8
    maxResidentCells: 1000
  vars:
    secretRef: chat-vars
  websockets: true
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targets:
      residentCellUtilization: 70
      p95LatencyMs: 250
  telemetry:
    enabled: true
    retention: 30d
