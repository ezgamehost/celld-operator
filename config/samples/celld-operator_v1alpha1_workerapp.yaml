apiVersion: celld-operator.io/v1alpha1
kind: WorkerApp
metadata:
  labels:
    app.kubernetes.io/name: celld-operator
    app.kubernetes.io/managed-by: kustomize
  name: chat
spec:
  hostnames: ["chat.acme.ezghcloud.com"]
  appVersion: sha-abc123
  celld:
    image: ghcr.io/denoland/celld:v0.4.0
    updateStrategy: Rolling
  replicas: 3
  bucket:
    name: s3://platform-cells/apps/chat
    credentialsFrom:
      iamRole: auto
    # Azure Blob Storage instead: the name is the container, the account
    # is separate, and AKS workload identity replaces the IAM role.
    # name: az://platform-cells/apps/chat
    # storageAccount: platformcells
    # credentialsFrom:
    #   azureClientID: 11111111-2222-3333-4444-555555555555
  resources:
    memoryGi: 8
    maxResidentCells: 1000
  vars:
    secretRef: chat-vars
  websockets: true
  # durability: fleet           # celld's default; "bucket" waits for the upload before acking
  # trustForwardedHeaders: true # only behind a proxy that replaces X-Forwarded-Host and -Proto
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targets:
      residentCellUtilization: 70
      p95LatencyMs: 250
  telemetry:
    enabled: true
    retention: 30d           # bucket sink (default): Parquet in the fleet bucket
    # sink: otlp             # or send OTLP/HTTP to a collector instead:
    # otlpEndpoint: http://otel-collector.monitoring.svc:4318
