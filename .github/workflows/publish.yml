name: Publish Image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    # The chart's default image tag is its appVersion; publish the image
    # first so an install of a fresh chart can always pull it.
    needs: image
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-main.${{ github.run_number }}"
          fi
          helm package dist/chart --version "$VERSION" --app-version "sha-${SHORT_SHA}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Push
        run: helm push "celld-operator-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: [image, chart]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          # semantic-release 24 bundles conventional-changelog-writer 8.
          # Preset 9 requires writer 9 and fails while generating notes.
          extra_plugins: conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tags created with GITHUB_TOKEN cannot retrigger this workflow, so
      # the versioned artifacts are published here: the release version
      # retags the sha image this run already pushed, and the chart is
      # packaged with the clean semver.
      - name: Publish versioned image and chart
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.new_release_version }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:v${VERSION}" \
            "ghcr.io/${{ github.repository }}:sha-${SHORT_SHA}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package dist/chart --version "$VERSION" --app-version "v${VERSION}"
          helm push "celld-operator-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
