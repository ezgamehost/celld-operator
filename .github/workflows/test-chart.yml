name: Test Chart

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare celld-operator
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart
          go test ./test/chart

      - name: Deploy manager via Helm
        run: |
          make helm-deploy HELM_EXTRA_ARGS="--set controllerManager.container.imagePullPolicy=Never"
          test "$(kubectl get deployment celld-operator-controller-manager -n celld-operator-system -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$IMG"

      - name: Check Helm release status
        run: |
          make helm-status

      - name: Delete isolated cluster
        if: always()
        run: kind delete cluster
